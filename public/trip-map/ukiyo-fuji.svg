<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">旅の謎 — 富士山與海浪木版畫風景</title>
<desc id="desc">和紙紋理的米色天空、朱紅圓日、靛藍遠山與層疊浪花，呈現浮世繪版畫風格。</desc>
<defs>
 <pattern id="paper" width="31" height="29" patternUnits="userSpaceOnUse">
  <path d="M0 5h18M10 21h19M3 26h8" stroke="#765b40" stroke-width=".55" opacity=".19"/>
  <circle cx="25" cy="4" r=".8" fill="#765b40" opacity=".22"/>
  <circle cx="7" cy="16" r=".7" fill="#765b40" opacity=".14"/>
 </pattern>
 <pattern id="seaHatch" width="38" height="18" patternUnits="userSpaceOnUse">
  <path d="M0 12q9-8 19 0t19 0" fill="none" stroke="#e9e4d0" stroke-width="1.8" opacity=".65"/>
 </pattern>
 <pattern id="cloudHatch" width="24" height="16" patternUnits="userSpaceOnUse">
  <path d="M1 11h17m-10-7h15" stroke="#f8ead6" stroke-width="1.2" opacity=".5"/>
 </pattern>
 <clipPath id="ocean">
  <path d="M0 470q150-60 313-10t290-10q170-70 324-8t273-21v299H0Z"/>
 </clipPath>
</defs>
