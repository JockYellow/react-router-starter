name: Telegram Mover Lockfile

on:
  push:
    branches:
      - feature/telegram-mover-pwa
    paths:
      - ".github/workflows/telegram-mover-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/telegram-mover-pwa

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "build: refresh lockfile for mtcute"
            git push origin HEAD:feature/telegram-mover-pwa
          fi
