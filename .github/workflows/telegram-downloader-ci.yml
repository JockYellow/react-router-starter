name: Telegram Downloader CI

on:
  pull_request:
    paths:
      - "app/routes/tools/telegram-mover.tsx"
      - "public/telegram-mover.webmanifest"
      - "public/telegram-mover-icon.svg"
      - "vite.config.ts"
      - "workers/app.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/telegram-downloader-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
