name: Anime Memory OpenCC Lockfile

on:
  push:
    branches:
      - feature/anime-memory

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/anime-memory

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned OpenCC dependency
        run: npm install --save-exact opencc-js@1.4.2

      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "OpenCC dependency already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(anime): add opencc-js 1.4.2"
          git push origin HEAD:feature/anime-memory
