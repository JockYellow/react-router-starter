name: Anime Provider Probe

on:
  push:
    branches:
      - refactor/anime-provider-neutral
    paths:
      - .github/workflows/anime-jikan-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Bangumi TV and WEB browse endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.bgm.tv/v0/subjects?type=2&year=2011&month=1&sort=date&limit=100&offset=0'
          for cat in 1 5; do
            url="$base&cat=$cat"
            code=$(curl --silent --show-error --location \
              --header 'Accept: application/json' \
              --header 'User-Agent: AnimeMemory/1.0 (https://github.com/JockYellow/react-router-starter)' \
              --output "/tmp/bgm-$cat.json" --write-out '%{http_code}' "$url")
            echo "cat=$cat HTTP $code"
            node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log({total:p.total??null,limit:p.limit??null,offset:p.offset??null,items:Array.isArray(p.data)?p.data.length:null,first:p.data?.[0]?.name??null}); if(!Array.isArray(p.data)) process.exit(2)' "/tmp/bgm-$cat.json"
            test "$code" = "200"
          done
